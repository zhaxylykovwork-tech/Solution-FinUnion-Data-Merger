<text x="1522" y="730" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" fill="#182c47">Регуляторный потребитель</text>
<text x="1522" y="753" font-family="Arial,DejaVu Sans,sans-serif" font-size="18" fill="#182c47">Утверждённый пакет / ack</text>
<text x="1522" y="779" font-family="Arial,DejaVu Sans,sans-serif" font-size="18" fill="#182c47">Отправка только после sign-off</text>
<text x="35" y="1165" font-family="Arial,DejaVu Sans,sans-serif" font-size="18" fill="#182c47">Серые — внешние участники относительно P0. Синий — единый процесс платформы.</text>
<text x="35" y="1190" font-family="Arial,DejaVu Sans,sans-serif" font-size="18" fill="#182c47">F18/F19 и F20/F15 — вход и результат. Технический ack F16 фиксирует доставка, не финансовую приёмку.</text>
