<rect x="40" y="200" width="430" height="190" rx="8" fill="#e7f0ff" stroke="#60728b" stroke-width="2"/>
<text x="52" y="230" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" fill="#182c47">M1 | недели 1–2</text>
<text x="52" y="253" font-family="Arial,DejaVu Sans,sans-serif" font-size="18" fill="#182c47">Discovery / owners / baseline</text>
<text x="52" y="279" font-family="Arial,DejaVu Sans,sans-serif" font-size="18" fill="#182c47">Gate: scope + источники</text>
<rect x="570" y="200" width="430" height="190" rx="8" fill="#e7f0ff" stroke="#60728b" stroke-width="2"/>
<text x="582" y="230" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" fill="#182c47">M2 | недели 3–6</text>
<text x="582" y="253" font-family="Arial,DejaVu Sans,sans-serif" font-size="18" fill="#182c47">Identity / reference pilot</text>
<text x="582" y="279" font-family="Arial,DejaVu Sans,sans-serif" font-size="18" fill="#182c47">Gate: safe match + unmerge</text>
<rect x="1100" y="200" width="430" height="190" rx="8" fill="#e7f0ff" stroke="#60728b" stroke-width="2"/>
<text x="1112" y="230" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" fill="#182c47">M3 | недели 5–10</text>
<text x="1112" y="253" font-family="Arial,DejaVu Sans,sans-serif" font-size="18" fill="#182c47">Общий PG DWH / catalog</text>
<text x="1112" y="279" font-family="Arial,DejaVu Sans,sans-serif" font-size="18" fill="#182c47">Gate: full reconciliation</text>
<rect x="1630" y="200" width="430" height="190" rx="8" fill="#fff1d4" stroke="#60728b" stroke-width="2"/>
<text x="1642" y="230" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" fill="#182c47">M4 | недели 11–12</text>
<text x="1642" y="253" font-family="Arial,DejaVu Sans,sans-serif" font-size="18" fill="#182c47">Cutover отчётности</text>
<text x="1642" y="279" font-family="Arial,DejaVu Sans,sans-serif" font-size="18" fill="#182c47">3 месяца: общий профиль/BI</text>
<rect x="40" y="640" width="430" height="190" rx="8" fill="#e7f0ff" stroke="#60728b" stroke-width="2"/>
<text x="52" y="670" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" fill="#182c47">M5 | месяцы 4–6</text>
<text x="52" y="693" font-family="Arial,DejaVu Sans,sans-serif" font-size="18" fill="#182c47">CRM / cases / consents</text>
<text x="52" y="719" font-family="Arial,DejaVu Sans,sans-serif" font-size="18" fill="#182c47">Gate: один writer в когорте</text>
<rect x="570" y="640" width="430" height="190" rx="8" fill="#e7f0ff" stroke="#60728b" stroke-width="2"/>
<text x="582" y="670" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" fill="#182c47">M6 | месяцы 6–9</text>
<text x="582" y="693" font-family="Arial,DejaVu Sans,sans-serif" font-size="18" fill="#182c47">Core / Cards / Loans волны</text>
<text x="582" y="719" font-family="Arial,DejaVu Sans,sans-serif" font-size="18" fill="#182c47">Gate: finance/legal/certification</text>
<rect x="1100" y="640" width="430" height="190" rx="8" fill="#e7f0ff" stroke="#60728b" stroke-width="2"/>
<text x="1112" y="670" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" fill="#182c47">M7 | месяцы 7–10</text>
<text x="1112" y="693" font-family="Arial,DejaVu Sans,sans-serif" font-size="18" fill="#182c47">Lakehouse / data products</text>
<text x="1112" y="719" font-family="Arial,DejaVu Sans,sans-serif" font-size="18" fill="#182c47">Gate: replay / ACL / cost</text>
<rect x="1630" y="640" width="430" height="190" rx="8" fill="#fff1d4" stroke="#60728b" stroke-width="2"/>
<text x="1642" y="670" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" fill="#182c47">M8 | месяцы 10–12</text>
<text x="1642" y="693" font-family="Arial,DejaVu Sans,sans-serif" font-size="18" fill="#182c47">Stabilize / archive / shutdown</text>
<text x="1642" y="719" font-family="Arial,DejaVu Sans,sans-serif" font-size="18" fill="#182c47">12 месяцев: exit gates</text>
<text x="35" y="1135" font-family="Arial,DejaVu Sans,sans-serif" font-size="18" fill="#182c47">Каждая волна: consistent T0 → history+delta → shadow → DQ/finance → Go/No-Go → fencing/route → observation.</text>
<text x="35" y="1160" font-family="Arial,DejaVu Sans,sans-serif" font-size="18" fill="#182c47">Непереносимый портфель остаётся у одного RB-мастера как открытое исключение; полное отключение не объявляется.</text>
