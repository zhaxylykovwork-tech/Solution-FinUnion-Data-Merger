<text x="62" y="583" font-family="Arial,DejaVu Sans,sans-serif" font-size="18" fill="#182c47">PK account_sk</text>
<text x="62" y="609" font-family="Arial,DejaVu Sans,sans-serif" font-size="18" fill="#182c47">source account / type / status</text>
<rect x="50" y="880" width="430" height="150" rx="8" fill="#e4f4ed" stroke="#60728b" stroke-width="2"/>
<text x="62" y="910" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" fill="#182c47">dim_product (SCD2)</text>
<text x="62" y="933" font-family="Arial,DejaVu Sans,sans-serif" font-size="18" fill="#182c47">PK product_sk</text>
<text x="62" y="959" font-family="Arial,DejaVu Sans,sans-serif" font-size="18" fill="#182c47">product / tariff version / interval</text>
