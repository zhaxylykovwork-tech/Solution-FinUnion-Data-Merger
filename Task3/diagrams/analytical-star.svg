<text x="762" y="689" font-family="Arial,DejaVu Sans,sans-serif" font-size="18" fill="#182c47">source_position / publish_version</text>
<rect x="50" y="180" width="430" height="150" rx="8" fill="#e4f4ed" stroke="#60728b" stroke-width="2"/>
<text x="62" y="210" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" fill="#182c47">dim_customer (SCD2)</text>
<text x="62" y="233" font-family="Arial,DejaVu Sans,sans-serif" font-size="18" fill="#182c47">PK customer_sk</text>
<text x="62" y="259" font-family="Arial,DejaVu Sans,sans-serif" font-size="18" fill="#182c47">global ID / segment / intervals</text>
<rect x="50" y="530" width="430" height="150" rx="8" fill="#e4f4ed" stroke="#60728b" stroke-width="2"/>
