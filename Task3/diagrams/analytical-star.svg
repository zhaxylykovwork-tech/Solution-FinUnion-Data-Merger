<text x="762" y="533" font-family="Arial,DejaVu Sans,sans-serif" font-size="18" fill="#182c47">PK posting_sk</text>
<text x="762" y="559" font-family="Arial,DejaVu Sans,sans-serif" font-size="18" fill="#182c47">UNIQUE source_system+posting_id</text>
<text x="762" y="585" font-family="Arial,DejaVu Sans,sans-serif" font-size="18" fill="#182c47">FK customer/account/product/branch</text>
<text x="762" y="611" font-family="Arial,DejaVu Sans,sans-serif" font-size="18" fill="#182c47">FK bank/currency/booking_date</text>
<text x="762" y="637" font-family="Arial,DejaVu Sans,sans-serif" font-size="18" fill="#182c47">ledger_transaction_id / payment_ref?</text>
