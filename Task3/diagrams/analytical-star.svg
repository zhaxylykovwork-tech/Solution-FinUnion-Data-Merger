<text x="1522" y="233" font-family="Arial,DejaVu Sans,sans-serif" font-size="18" fill="#182c47">PK branch_sk</text>
<text x="1522" y="259" font-family="Arial,DejaVu Sans,sans-serif" font-size="18" fill="#182c47">bank / region / interval</text>
<rect x="1510" y="530" width="430" height="150" rx="8" fill="#e4f4ed" stroke="#60728b" stroke-width="2"/>
<text x="1522" y="560" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" fill="#182c47">dim_bank</text>
<text x="1522" y="583" font-family="Arial,DejaVu Sans,sans-serif" font-size="18" fill="#182c47">PK bank_sk</text>
<text x="1522" y="609" font-family="Arial,DejaVu Sans,sans-serif" font-size="18" fill="#182c47">origin bank / legal entity</text>
<rect x="1510" y="880" width="430" height="150" rx="8" fill="#e4f4ed" stroke="#60728b" stroke-width="2"/>
<text x="1522" y="910" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" fill="#182c47">dim_currency</text>
<text x="1522" y="933" font-family="Arial,DejaVu Sans,sans-serif" font-size="18" fill="#182c47">PK currency_sk</text>
<text x="1522" y="959" font-family="Arial,DejaVu Sans,sans-serif" font-size="18" fill="#182c47">currency_code / minor_unit</text>
<rect x="750" y="1120" width="480" height="150" rx="8" fill="#e4f4ed" stroke="#60728b" stroke-width="2"/>
<text x="762" y="1150" font-family="Arial,DejaVu Sans,sans-serif" font-size="21" fill="#182c47">dim_date</text>
<text x="762" y="1173" font-family="Arial,DejaVu Sans,sans-serif" font-size="18" fill="#182c47">PK date_sk</text>
<text x="762" y="1199" font-family="Arial,DejaVu Sans,sans-serif" font-size="18" fill="#182c47">bank calendar / reporting period</text>
<text x="35" y="1355" font-family="Arial,DejaVu Sans,sans-serif" font-size="18" fill="#182c47">SCD2 join по [valid_from, valid_to) на business time. У каждого факта ровно одна версия каждой dimension.</text>
<text x="35" y="1380" font-family="Arial,DejaVu Sans,sans-serif" font-size="18" fill="#182c47">Меры суммируются только в одной валюте. Остаток — отдельный daily snapshot, не сумма остатков за дни.</text>
</svg>